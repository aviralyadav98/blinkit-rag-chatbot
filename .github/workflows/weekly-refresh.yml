name: Weekly Corpus Refresh

# Cloud equivalent of the Windows Task Scheduler run (Phase 8) — fires even when the
# user's PC is off. Runs the full pipeline (ingest -> process -> report -> validate),
# then commits the refreshed corpus + report back to the repo, which triggers Streamlit
# Community Cloud to redeploy the live app.
#
# PREREQUISITES (not yet done — see docs/IMPLEMENTATION.md Phase 8/9):
#   1. This repo must live on GitHub with the corpus TRACKED (rag/chroma_data,
#      processing/insights.db, processing/data/chunks_embedded.jsonl, docs/INSIGHT_REPORT.md).
#      GitHub allows these file sizes (<100MB) without LFS.
#   2. Repo Settings -> Secrets and variables -> Actions, add:
#        GROQ_API_KEY, REDDIT_CLIENT_ID, REDDIT_CLIENT_SECRET
#      Optional: SYNTHESIS_MODEL (e.g. llama-3.1-8b-instant if 70B quota is tight),
#                APIFY_TOKEN (only for the paid fallback ingestion path).
#   Google Docs publishing is skipped here (its OAuth token isn't in CI); the report is
#   committed back to the repo and served by the web app instead.

on:
  schedule:
    - cron: "30 21 * * 0"    # Sun 21:30 UTC = Mon 03:00 IST
  workflow_dispatch:          # manual "Run workflow" button in the Actions tab
    inputs:
      skip_ingest:
        description: "Skip live scraping (reprocess existing corpus only)"
        type: boolean
        default: false

permissions:
  contents: write             # to commit the refreshed corpus + report back

concurrency:
  group: weekly-refresh       # never run two refreshes at once
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements-pipeline.txt') }}

      - name: Cache bge-m3 model (~2.3GB, download once)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-m3-v1

      - name: Install dependencies
        run: pip install -r requirements-pipeline.txt

      - name: Run refresh pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: "blinkit-rag-chatbot/0.1 (research script)"
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          SYNTHESIS_MODEL: ${{ secrets.SYNTHESIS_MODEL }}
          # First cache-miss run must be allowed to download bge-m3 (the code
          # defaults to offline for local runs where the model is already cached).
          HF_HUB_OFFLINE: "0"
          TRANSFORMERS_OFFLINE: "0"
        run: |
          if [ "${{ github.event.inputs.skip_ingest }}" = "true" ]; then
            python refresh.py --skip-ingest
          else
            python refresh.py
          fi

      - name: Commit refreshed corpus + report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Force-add the corpus/report even if a local .gitignore would exclude them —
          # the deployed app needs them in the repo.
          git add -f rag/chroma_data processing/insights.db \
                     processing/data/chunks_embedded.jsonl docs/INSIGHT_REPORT.md
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Weekly refresh: corpus + report [skip ci]"
            git push
          fi
